<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Hunt – Parts of Speech</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#191b2f;--mut:#697091;--bd:#dfe2f2;--ac:#5b5bf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f20;--card:#171a33;--tx:#eef0ff;--mut:#9aa0c4;--bd:#292d52;--ac:#7c7cff}}
:root[data-theme="dark"]{--bg:#0d0f20;--card:#171a33;--tx:#eef0ff;--mut:#9aa0c4;--bd:#292d52;--ac:#7c7cff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow:hidden}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:8px 10px;font-family:'Bricolage Grotesque',sans-serif}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;margin-right:auto}
.logo svg{font-size:22px;color:var(--ac)}
.stat{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:5px 11px;font-weight:700;font-size:15px}
.stat svg{font-size:16px}
#sc svg{color:#f59e0b}#st svg{color:#f97316}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.3)}}
#bar{height:5px;background:var(--bd);margin:0 10px;border-radius:9px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b5bf0,#ec4899);transition:width .5s}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0;position:relative}
#hint{color:var(--mut);font-size:14px;text-align:center;height:20px;transition:.2s}
#sent{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px;padding:0 8px;margin:14px 0}
.w{display:flex;flex-direction:column;align-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(22px,5.4vw,36px);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:6px 12px 4px;cursor:pointer;color:var(--tx);transition:transform .15s,background .25s,border-color .25s;position:relative;min-width:44px}
.w small{font:600 11px Inter,sans-serif;height:14px;opacity:0;transition:.3s}
.w:hover:not(.ok){transform:translateY(-3px);border-color:var(--ac)}
.w.ok{color:#fff;cursor:default;animation:pop .45s}
.w.ok small{opacity:.95}
.w.bad{animation:shake .4s;border-color:#ef4444}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fl{position:absolute;pointer-events:none;font:800 22px 'Bricolage Grotesque';color:#f59e0b;animation:fl 1s forwards;z-index:9;text-shadow:0 2px 8px rgba(0,0,0,.25)}
@keyframes fl{to{transform:translateY(-70px) scale(1.3);opacity:0}}
#next{display:none;align-items:center;gap:8px;background:var(--ac);color:#fff;border:0;border-radius:99px;padding:11px 24px;font:700 17px 'Bricolage Grotesque';cursor:pointer;animation:pop .5s}
#next svg{font-size:20px}
#msg{font:800 20px 'Bricolage Grotesque';height:26px;color:var(--ac)}
#pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px 10px}
@media(min-width:700px){#pal{grid-template-columns:repeat(9,1fr)}}
.c{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--col);background:color-mix(in srgb,var(--col) 14%,var(--card));color:var(--tx);border-radius:12px;padding:8px 2px;font:700 14px 'Bricolage Grotesque';cursor:pointer;transition:.15s}
.c span{font:600 10px Inter;opacity:.6}
.c:hover{transform:translateY(-2px)}
.c.on{background:var(--col);color:#fff;transform:translateY(-4px) scale(1.05);box-shadow:0 6px 18px color-mix(in srgb,var(--col) 55%,transparent)}
.c.on span{opacity:.85}
#pal.nudge{animation:shake .4s}
.pt{position:absolute;width:9px;height:9px;border-radius:2px;left:50%;top:45%;animation:pt 1.1s ease-out forwards;pointer-events:none}
@keyframes pt{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
#end{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;z-index:20;font-family:'Bricolage Grotesque'}
#end.show{display:flex}
#stars{display:flex;gap:6px;font-size:52px;color:#f59e0b}
#stars svg{fill:none;opacity:.35}#stars svg.f{fill:#f59e0b;opacity:1;animation:pop .6s backwards}
#end h1{font-size:34px}
#end p{color:var(--mut);font:400 16px Inter}
#big{font-size:64px;font-weight:800;color:var(--ac)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
#tk svg{color:var(--ac)}
#pn{font-size:13px;padding:3px 9px}
@media(max-width:480px){.logo .t{display:none}}
.cw{position:relative;display:flex}.cw .c{width:100%}
.inf{position:absolute;top:2px;right:2px;width:24px;height:24px;border:0;background:none;color:var(--tx);opacity:.6;display:grid;place-items:center;font-size:15px;cursor:pointer;border-radius:50%}
.inf:hover{opacity:1}.c.on+.inf{color:#fff;opacity:.9}
#end{overflow:auto;align-items:stretch;justify-content:flex-start;text-align:center}
#er{margin:auto;width:100%;max-width:560px;padding:10px;display:flex;flex-direction:column;gap:10px}
#er h1{font-size:28px}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.rl{display:flex;justify-content:center;align-items:center;gap:5px;color:var(--mut);font:600 13px Inter}
.rv{font:800 clamp(22px,7vw,32px) 'Bricolage Grotesque';margin:2px 0 4px}
.rd{font:400 12px Inter;color:var(--mut);display:flex;justify-content:center;align-items:center;gap:3px;flex-wrap:wrap}
.rd.g{color:#16a34a}.rd.r{color:#dc2626}.rd b{color:#f59e0b}
#tr{text-align:left}
.tt{display:flex;align-items:center;gap:6px;font:700 15px 'Bricolage Grotesque';margin-bottom:4px}
.tr{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;padding:4px 0;cursor:pointer;font:600 13px Inter}
.tb{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.tb i{display:block;height:100%;border-radius:9px;animation:grow .8s backwards}
@keyframes grow{from{width:0!important}}
#again{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--ac);color:#fff;border:0;border-radius:99px;padding:12px 24px;font:700 17px 'Bricolage Grotesque';cursor:pointer}
#info{position:fixed;inset:0;background:rgba(5,6,20,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
#info.show{display:flex}
.sh{background:var(--card);color:var(--tx);border-top:5px solid var(--col);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .25s}
@media(min-width:700px){#info{align-items:center}.sh{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh h2{display:flex;align-items:center;gap:8px;font:800 24px 'Bricolage Grotesque';color:var(--col)}
.sh h2 button{margin-left:auto;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;display:grid}
.sh p{margin:8px 0;line-height:1.5}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.ex span{background:var(--col);color:#fff;border-radius:8px;padding:3px 10px;font:700 15px 'Bricolage Grotesque'}
.tp{background:color-mix(in srgb,var(--col) 14%,var(--card));border-radius:10px;padding:8px 10px;font-size:14px}
</style>
</head>
<body>
<div id="app">
<header>
<div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span class="t">Word Hunt</span><span class="stat" id="pn">1/5</span></div>
<div class="stat" id="tk" data-ic="clock"><b id="tm">0:00.0</b></div>
<div class="stat" id="st" data-ic="flame"><b>0</b></div>
<div class="stat" id="sc" data-ic="zap"><b>0</b></div>
</header>
<div id="bar"><i></i></div>
<main>
<div id="hint"></div>
<div id="sent"></div>
<div id="msg"></div>
<button id="next"><span id="nt">Next sentence</span><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
<div id="end"><div id="er">
<h1>Session complete</h1>
<div id="cards"></div>
<div class="rc" id="tr"></div>
<button id="again"><span>Next session</span><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
</div></div>
</main>
<div id="pal"></div>
</div>
<div id="info"><div class="sh" id="sh"></div></div>
<script>
const POS={
n:['Noun','#2563eb','Names a person, place, thing or idea.','Ravi, Shimla, book, courage','Put "the" before it. If it fits (the book, the courage), it is a noun.'],
p:['Pronoun','#9333ea','Takes the place of a noun so you do not repeat it.','I, she, they, it, me, everyone','Ask: could this word stand in for a name? Then it is a pronoun.'],
v:['Verb','#dc2626','Shows an action or a state of being. Every sentence needs one.','runs, sang, is, was','Change the tense. If the word can change (run to ran), it is a verb.'],
j:['Adjective','#d97706','Describes a noun: what kind, which one or how many.','tall, red, interesting, cold','Ask "what kind?" about a noun. The answer is the adjective.'],
a:['Adverb','#059669','Describes a verb, an adjective or another adverb: how, when, where or how much.','quickly, very, daily, late','Ask "how?" or "when?" about the action. Many end in -ly.'],
e:['Preposition','#db2777','Links a noun or pronoun to another word to show place, time or direction.','on, under, through, at, to','Fits "The cat is ___ the box" (in, on, under). It is followed by a noun.'],
c:['Conjunction','#0891b2','Joins words, phrases or sentences together.','and, but, or, because','It is the glue between two ideas. Try swapping it with "and" or "but".'],
i:['Interjection','#ea580c','Shows a sudden feeling. It stands apart, often with "!".','Wow, Ouch, Alas, Hurray','Remove it. The sentence still works, so it is an interjection.'],
d:['Article','#65a30d','Points to a noun. "The" is specific, "a" and "an" are general.','a, an, the','It always sits before a noun or its adjectives (the big dog).']};
const S=["Wow!/i The/d little/j puppy/n runs/v quickly/a.","She/p sings/v beautifully/a.","The/d cat/n sleeps/v on/e the/d soft/j sofa/n.","I/p like/v tea/n and/c coffee/n.","Oh!/i They/p won/v the/d big/j match/n.","He/p walked/v slowly/a to/e school/n.","Ravi/n eats/v an/d apple/n daily/a.","We/p played/v cricket/n but/c it/p rained/v heavily/a.","Hurray!/i The/d red/j kite/n flew/v high/a.","Birds/n fly/v above/e the/d tall/j trees/n.","Ouch!/i The/d hot/j tea/n burned/v me/p.","Mira/n reads/v interesting/j books/n at/e night/n.","The/d children/n laughed/v loudly/a and/c clapped/v happily/a.","He/p is/v very/a tall/j.","The/d river/n flows/v through/e the/d green/j valley/n.","Alas!/i The/d old/j man/n cried/v sadly/a.","They/p sat/v under/e a/d tree/n because/c it/p was/v hot/j.","Shimla/n gets/v cold/j winters/n.","Wow!/i She/p drew/v a/d beautiful/j picture/n.","Rohan/n and/c Simran/n danced/v gracefully/a on/e stage/n.",
"Yay!/i We/p won/v the/d final/j game/n.","The/d baby/n smiled/v sweetly/a at/e me/p.","Dogs/n bark/v loudly/a but/c cats/n purr/v softly/a.","She/p bought/v fresh/j vegetables/n from/e the/d market/n.","Ouch!/i The/d sharp/j knife/n cut/v him/p.","Ananya/n finished/v the/d test/n early/a.","You/p study/v daily/a and/c learn/v quickly/a.","The/d tiny/j ant/n carried/v a/d heavy/j leaf/n.","Hooray!/i It/p is/v a/d sunny/j day/n.","Kabir/n sat/v beside/e me/p and/c smiled/v.","The/d moon/n shines/v brightly/a above/e the/d quiet/j village/n.","Oh/i no!/i The/d milk/n spilled/v everywhere/a.","Farmers/n grow/v wheat/n and/c rice/n in/e Punjab/n.","He/p speaks/v English/n fluently/a.","Bravo!/i You/p played/v very/a well/a.","The/d train/n arrived/v late/a because/c it/p was/v foggy/j.","Neha/n and/c I/p walked/v along/e the/d river/n.","A/d wise/j teacher/n explains/v difficult/j ideas/n patiently/a.","Phew!/i The/d exam/n was/v easy/j.","Snow/n falls/v gently/a on/e the/d white/j hills/n.","They/p built/v a/d small/j house/n near/e the/d lake/n.","Yikes!/i A/d big/j spider/n crawled/v across/e the/d floor/n.","Sita/n cooks/v delicious/j food/n and/c serves/v it/p warmly/a.","The/d bus/n stopped/v suddenly/a and/c everyone/p screamed/v.","Ah!/i The/d cake/n smells/v wonderful/j.","We/p watched/v a/d funny/j movie/n after/e dinner/n.","Tara/n reads/v quietly/a in/e the/d library/n.","Hey!/i You/p dropped/v the/d red/j pen/n.","Mountains/n look/v beautiful/j when/c snow/n covers/v them/p.","He/p ran/v fast/a but/c she/p ran/v faster/a."];
const I={clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',up:'<path d="m5 12 7-7 7 7M12 19V5"/>',down:'<path d="M12 5v14M19 12l-7 7-7-7"/>',target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',cross:'<path d="M18 6 6 18M6 6l12 12"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24">'+I[n]+'</svg>';
const $=s=>document.querySelector(s);
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic)+e.innerHTML);
const D=(()=>{try{return JSON.parse(localStorage.getItem('wh2'))||{h:[],st:{}}}catch(e){return{h:[],st:{}}}})();
const save=()=>{try{localStorage.setItem('wh2',JSON.stringify(D))}catch(e){}};
let pool=[],ses,si,score,streak,sel,mist,left,fin,sT,sM,sMap,acc=0,t0=0,run=false;
const el=()=>acc+(run?performance.now()-t0:0);
const fmt=ms=>{const s=ms/1000;return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0')};
const startT=()=>{acc=0;t0=performance.now();run=true};
const pauseT=()=>{if(run){acc+=performance.now()-t0;run=false}};
const resumeT=()=>{if(!run){t0=performance.now();run=true}};
setInterval(()=>$('#tm').textContent=fmt(el()),100);
const pal=$('#pal'),sent=$('#sent'),hint=$('#hint');
Object.entries(POS).forEach(([k,p],x)=>{const w=document.createElement('div');w.className='cw';w.style.setProperty('--col',p[1]);w.innerHTML='<button class="c" data-k="'+k+'">'+p[0]+'<span>'+(x+1)+'</span></button><button class="inf" aria-label="About '+p[0]+'">'+ic('info')+'</button>';w.firstChild.onclick=()=>pick(k);w.lastChild.onclick=()=>openI(k);pal.appendChild(w)});
function pick(k){sel=k;pal.querySelectorAll('.c').forEach(c=>c.classList.toggle('on',c.dataset.k==k));hint.textContent='Now tap every '+POS[k][0].toLowerCase()+' in the sentence'}
function openI(k){pauseT();const [n,c,d,x,t]=POS[k];$('#sh').style.setProperty('--col',c);$('#sh').innerHTML='<h2>'+n+'<button id="cl" aria-label="Close">'+ic('x')+'</button></h2><p>'+d+'</p><div class="ex">'+x.split(', ').map(w=>'<span>'+w+'</span>').join('')+'</div><div class="tp"><b>Tip:</b> '+t+'</div>';$('#cl').onclick=closeI;$('#info').classList.add('show')}
function closeI(){if(!$('#info').classList.contains('show'))return;$('#info').classList.remove('show');if(ses&&!fin)resumeT()}
$('#info').onclick=e=>{if(e.target.id=='info')closeI()};
function bump(s,v){const e=$(s+' b');e.textContent=v;e.parentNode.classList.remove('bump');void e.offsetWidth;e.parentNode.classList.add('bump')}
const setScore=v=>{score=v;bump('#sc',v)},setStreak=v=>{streak=v;bump('#st',v)};
function float(el,t){const r=el.getBoundingClientRect(),m=$('main').getBoundingClientRect(),f=document.createElement('div');f.className='fl';f.textContent=t;f.style.left=(r.left-m.left+r.width/2-20)+'px';f.style.top=(r.top-m.top-10)+'px';$('main').appendChild(f);setTimeout(()=>f.remove(),1000)}
function burst(n){const cols=Object.values(POS).map(v=>v[1]);for(let i=0;i<n;i++){const p=document.createElement('i');p.className='pt';p.style.background=cols[i%9];p.style.setProperty('--x',(Math.random()*500-250)+'px');p.style.setProperty('--y',(Math.random()*-300+120)+'px');p.style.setProperty('--r',Math.random()*720+'deg');$('main').appendChild(p);setTimeout(()=>p.remove(),1100)}}
function load(){
const toks=S[ses[si]].split(' ').map(t=>{const [w,r]=t.split('/');return{w:w+r.slice(1),k:r[0]}});
mist=0;left=toks.length;fin=false;sent.innerHTML='';$('#msg').textContent='';$('#next').style.display='none';
toks.forEach(t=>{const b=document.createElement('button');b.className='w';b.innerHTML=t.w+'<small></small>';b.onclick=()=>tap(b,t.k);sent.appendChild(b)});
$('#bar i').style.width=(si/5*100)+'%';$('#pn').textContent=(si+1)+'/5';
hint.textContent=sel?'Now tap every '+POS[sel][0].toLowerCase()+' in the sentence':'Pick a part of speech, then tap a word';startT()}
function tap(b,k){
if(b.classList.contains('ok'))return;
if(!sel){hint.textContent='Pick a part of speech first!';pal.classList.remove('nudge');void pal.offsetWidth;pal.classList.add('nudge');return}
const st=D.st[k]=D.st[k]||[0,0];
if(sel==k){st[0]++;b.classList.add('ok');b.style.background=POS[k][1];b.style.borderColor=POS[k][1];b.querySelector('small').textContent=POS[k][0];
setStreak(streak+1);const g=10*Math.min(1+Math.floor(streak/3),4);setScore(score+g);float(b,'+'+g);
if(--left==0)finish()}
else{st[1]++;sMap[k]=(sMap[k]||0)+1;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');mist++;sM++;setStreak(0);
if(navigator.vibrate)navigator.vibrate(60);hint.textContent='Not a '+POS[sel][0].toLowerCase()+'. Try another word'}}
function finish(){
pauseT();fin=true;const tt=el();sT+=tt;const bonus=20+(mist==0?30:0);setScore(score+bonus);
$('#msg').textContent=(mist==0?'Perfect! ':'Done! ')+fmt(tt)+'  +'+bonus;burst(mist==0?40:22);
$('#nt').textContent=si==4?'See results':'Next sentence';$('#next').style.display='flex';$('#bar i').style.width=((si+1)/5*100)+'%'}
$('#next').onclick=()=>{if(si==4)return results();si++;load()};
function results(){
const H=D.h,cur={t:sT/1000,m:sM,s:score},last=H[H.length-1];
const defs=[['Time','t',1,v=>fmt(v*1000),'clock'],['Mistakes','m',1,v=>v,'cross'],['Score','s',0,v=>v,'zap']];
$('#cards').innerHTML=defs.map(([nm,key,lb,f,icn])=>{let line='<div class="rd">First session</div>';
if(last){const d=cur[key]-last[key],better=lb?d<0:d>0,vals=H.map(h=>h[key]),bv=lb?Math.min(...vals):Math.max(...vals),nb=lb?cur[key]<bv:cur[key]>bv,ad=key=='t'?Math.abs(d).toFixed(1)+'s':Math.abs(d);
line=(d==0?'<div class="rd">Same as last</div>':'<div class="rd '+(better?'g':'r')+'">'+ic(d<0?'down':'up')+ad+' vs last</div>')+'<div class="rd">'+(nb?'<b>New best!</b>':'Best '+f(bv))+'</div>'}
return'<div class="rc"><div class="rl">'+ic(icn)+nm+'</div><div class="rv">'+f(cur[key])+'</div>'+line+'</div>'}).join('');
H.push(cur);if(H.length>50)H.shift();save();
const rows=Object.entries(D.st).filter(([k,v])=>v[1]>0).map(([k,v])=>[k,v[1],v[1]/(v[0]+v[1])]).sort((a,b)=>b[2]-a[2]).slice(0,3);
$('#tr').innerHTML='<div class="tt">'+ic('target')+'Needs practice</div>'+(rows.length?rows.map(([k,m,r])=>'<div class="tr" data-k="'+k+'"><span style="color:'+POS[k][1]+'">'+POS[k][0]+'</span><div class="tb"><i style="width:'+Math.max(6,Math.round(r*100))+'%;background:'+POS[k][1]+'"></i></div><span>'+m+' missed'+(sMap[k]?' (+'+sMap[k]+')':'')+'</span></div>').join('')+'<div class="rd" style="justify-content:flex-start;margin-top:4px">Tap a row to review that part of speech.</div>':'<div class="rd">No mistakes yet. Flawless!</div>');
$('#tr').querySelectorAll('.tr').forEach(r=>r.onclick=()=>openI(r.dataset.k));
$('#end').classList.add('show');burst(50)}
function newSession(){if(pool.length<5)pool=S.map((_,i)=>i).sort(()=>Math.random()-.5);ses=pool.splice(0,5);si=0;score=0;streak=0;sT=0;sM=0;sMap={};
$('#sc b').textContent=0;$('#st b').textContent=0;$('#end').classList.remove('show');load()}
$('#again').onclick=newSession;
addEventListener('keydown',e=>{if(e.key=='Escape')return closeI();const k=Object.keys(POS)[+e.key-1];if(k&&!$('#end').classList.contains('show'))pick(k)});
newSession();
</script>
