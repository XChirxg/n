<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Builder</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#171923;--mut:#737889;--bd:#dfe2e8;--ac:#4f46e5;--good:#16a34a;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif}
#app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.logo{font-size:20px;font-weight:800;margin-right:auto}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:7px 12px;font-weight:700}
#bar{height:5px;background:var(--bd);margin:0 14px;border-radius:99px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--ac);transition:.3s}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 14px;gap:18px}
#topic{font-size:13px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.08em}
#question{font-size:clamp(28px,7vw,48px);font-weight:800;text-align:center;min-height:65px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
#question .blank{display:inline-flex;min-width:70px;height:55px;border:3px dashed var(--bd);border-radius:12px;align-items:center;justify-content:center;color:var(--mut);font-size:25px}
#question .filled{min-width:70px;padding:7px 10px;border:3px solid var(--ac);border-radius:12px;background:#eef2ff}
#prompt{color:var(--mut);text-align:center;min-height:22px}
#answer{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:760px}
.choice{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 17px;font-size:20px;font-weight:750;cursor:pointer;transition:.12s}
.choice:hover{transform:translateY(-2px);border-color:var(--ac)}
.choice.used{opacity:.3;pointer-events:none}
.choice.wrong{animation:shake .28s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#feedback{height:25px;font-weight:800}
.good{color:var(--good)} .bad{color:var(--bad)}
#next{display:none;border:0;background:var(--ac);color:white;border-radius:99px;padding:12px 25px;font-size:17px;font-weight:800;cursor:pointer}
#explain{max-width:680px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 15px;color:var(--mut);line-height:1.5;text-align:center;display:none}
#controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.small{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;color:var(--tx)}
@media(max-width:500px){.choice{font-size:18px;padding:11px 14px}header{padding-top:10px}.stat{font-size:13px}}
</style>
</head>
<body>
<div id="app">
<header><div class="logo">Math Builder</div><div class="stat" id="qno">1/10</div><div class="stat">✓ <span id="score">0</span></div></header>
<div id="bar"><i></i></div>
<main>
<div id="topic"></div>
<div id="question"></div>
<div id="prompt"></div>
<div id="answer"></div>
<div id="feedback"></div>
<div id="explain"></div>
<button id="next">Next →</button>
<div id="controls"><button class="small" id="new">New set</button></div>
</main>
</div>
<script>
const $=s=>document.querySelector(s);
let qIndex=0, score=0, current=null;

const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const token=(text,id)=>({text,id});

function makeQuestion(){
  const types=[
    exponentMultiply, exponentDivide, powerOfPower, negativeExponent,
    fractionalExponent, reciprocalNegative, bracketSquare, expansion
  ];
  return types[rand(0,types.length-1)]();
}

function build(topic, parts, prompt, explanation){
  // parts is the exact sequence the user must construct.
  // Distractors are generated from nearby/common mistakes.
  let options=[...parts];
  const distractors={
    "x^2+6x+9":["x^2+9","x^2+3x+9","x^2+6x"],
    "1/64":["1/8","1/16","64"],
    "4/5":["5/4","2/5","4/10"],
  };
  const d=distractors[parts.join('')]||[];
  options.push(...d.filter(x=>!options.includes(x)));
  while(options.length<Math.min(parts.length+3,7)){
    const pool=["+","−","2","3","4","5","x","x²","1/x³","1/2","1/3"];
    const x=pool[rand(0,pool.length-1)];
    if(!options.includes(x)) options.push(x);
  }
  return {topic,parts,prompt,explanation,options:shuffle(options.slice(0,Math.max(parts.length+2,5)))};
}

function exponentMultiply(){
  const a=rand(2,6),m=rand(2,5),n=rand(2,5);
  return build("Same-base multiplication",
    [`${a}^${m+n}`],
    `${a}^${m} × ${a}^${n} = ?`,
    `Same base → add the exponents: ${m} + ${n} = ${m+n}.`);
}
function exponentDivide(){
  const a=rand(2,8),m=rand(5,8),n=rand(2,4);
  return build("Same-base division",
    [`${a}^${m-n}`],
    `${a}^${m} ÷ ${a}^${n} = ?`,
    `Same base in division → subtract exponents: ${m} − ${n} = ${m-n}.`);
}
function powerOfPower(){
  const a=rand(2,5),m=rand(2,4),n=rand(2,4);
  return build("Power of a power",
    [`${a}^${m*n}`],
    `(${a}^${m})^${n} = ?`,
    `Power outside a power → multiply exponents: ${m} × ${n} = ${m*n}.`);
}
function negativeExponent(){
  const a=rand(2,8),n=rand(2,4);
  return build("Negative exponent",
    [`1/${a}^${n}`],
    `${a}^−${n} = ?`,
    `A negative exponent means reciprocal: ${a}^−${n} = 1/${a}^${n}.`);
}
function fractionalExponent(){
  const choices=[[4,2,2],[9,2,3],[8,3,2],[27,3,3],[16,2,4],[32,5,2]];
  const [base,n,root]=choices[rand(0,choices.length-1)];
  const ans=Math.pow(base,1/n);
  return build("Fractional exponent",
    [`${ans}`],
    `${base}^(1/${n}) = ?`,
    `1/${n} means the ${n}th root. So ${base}^(1/${n}) = ${ans}.`);
}
function reciprocalNegative(){
  return build("Negative exponent inside a fraction",
    ["x²"],
    `1 / x^−2 = ?`,
    `x^−2 = 1/x², so dividing 1 by 1/x² gives x².`);
}
function bracketSquare(){
  return build("Square of a bracket",
    ["x²","+","6x","+","9"],
    `(x + 3)² = ?`,
    `The square applies to the whole bracket: (x+3)(x+3). The middle terms give 6x.`);
}
function expansion(){
  return build("Distributive expansion",
    ["2x²","+","13x","+","15"],
    `(2x + 3)(x + 5) = ?`,
    `Multiply every term in the first bracket by every term in the second, then combine like terms.`);
}

function render(){
  current=makeQuestion();
  qIndex++;
  $("#qno").textContent=`${qIndex}/10`;
  $("#bar i").style.width=`${(qIndex-1)/10*100}%`;
  $("#topic").textContent=current.topic;
  $("#prompt").textContent="Click the pieces in the correct order.";
  $("#feedback").textContent="";
  $("#feedback").className="";
  $("#explain").style.display="none";
  $("#next").style.display="none";
  const q=$("#question"); q.innerHTML="";
  current.parts.forEach((_,i)=>{
    const b=document.createElement("span"); b.className="blank"; b.id=`slot${i}`; b.textContent="?"; q.appendChild(b);
  });
  const a=$("#answer"); a.innerHTML="";
  current.options.forEach((v,i)=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=v;
    b.onclick=()=>choose(b,v);
    a.appendChild(b);
  });
  current.pos=0;
}
function choose(btn,v){
  const expected=current.parts[current.pos];
  if(v!==expected){
    btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong");
    $("#feedback").textContent="Not next — look at the structure.";
    $("#feedback").className="bad";
    return;
  }
  $("#feedback").textContent="";
  $("#feedback").className="";
  const slot=$(`#slot${current.pos}`);
  slot.textContent=v; slot.className="filled";
  btn.classList.add("used");
  current.pos++;
  if(current.pos===current.parts.length){
    score++; $("#score").textContent=score;
    $("#feedback").textContent="Correct!";
    $("#feedback").className="good";
    $("#explain").textContent=current.explanation;
    $("#explain").style.display="block";
    $("#next").style.display="block";
    $("#bar i").style.width=`${qIndex/10*100}%`;
  }
}
$("#next").onclick=()=>{
  if(qIndex>=10){
    $("#topic").textContent="Set complete";
    $("#question").innerHTML=`<div style="font-size:32px">Score: ${score}/10</div>`;
    $("#prompt").textContent=score===10?"Perfect set.":"Good — repeat to make the rules automatic.";
    $("#answer").innerHTML="";
    $("#feedback").textContent="";
    $("#explain").style.display="none";
    $("#next").style.display="none";
    return;
  }
  render();
};
$("#new").onclick=()=>{qIndex=0;score=0;$("#score").textContent=0;render()};
render();
</script>
</body>
</html>
